[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admin-replacement-calculator"
version = "1.0.0"
description = "Conservative, deterministic admin automation diagnostic"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools]
packages = ["arc"]

[tool.setuptools.package-data]
arc = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
